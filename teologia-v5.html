<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teologia Descomplicada v5</title>
  <!-- ==========================================
       LEAFLET (Biblioteca de mapas)
       ========================================== -->
  <link rel="stylesheet" href="biblioteca/vendor/leaflet.css" />
  <script src="biblioteca/vendor/leaflet.js"></script>

  <!-- ==========================================
       MARKER CLUSTER (Agrupamento de marcadores)
       ========================================== -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- ==========================================
       CORES DOS LOCAIS (Central de Cores)
       ========================================== -->
  <script src="biblioteca/cores-locais-biblicos.js"></script>

  <!-- ==========================================
       DADOS DOS LOCAIS (940 locais bíblicos)
       ========================================== -->
  <script src="biblioteca/locais-biblicos.js"></script>

  <!-- ==========================================
       TRADUÇÕES PT
       ========================================== -->
  <script src="biblioteca/locais-biblicos-pt.js"></script>

  <script src="biblioteca/vendor/mermaid.min.js"></script>

  <!-- ==========================================
       BIBLIOTECA DE IMAGENS
       ========================================== -->
  <script src="biblioteca/imagens-biblicas.js"></script>

  <!-- ==========================================
       FILMES BÍBLICOS
       ========================================== -->
  <script src="biblioteca/filmes-biblicos.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e4e0d4; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; background-color: #fffef7; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
    header { background-color: #4a3b6e; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.8rem; }
    header a { color: white; background-color: #362b52; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; }
    .seletor-area { background-color: #f5f3f0; padding: 15px 30px; border-bottom: 1px solid #c9c0d4; display: flex; flex-direction: column; gap: 15px; }
    .seletor-linha { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .seletor-area select, .seletor-area button { padding: 8px 15px; font-size: 14px; border-radius: 6px; border: 1px solid #c9c0d4; background-color: white; }
    .seletor-area button { background-color: #4a3b6e; color: white; border: none; cursor: pointer; }
    .seletor-area button:hover { background-color: #362b52; }
    .titulo-capitalizado { background-color: #e4e0d4; padding: 10px 15px; border-radius: 6px; font-weight: bold; color: #4a3b6e; border-left: 4px solid #4a3b6e; font-size: 13px; }
    section { padding: 20px 30px; border-bottom: 1px solid #c9c0d4; }
    section h2 { color: #4a3b6e; margin-bottom: 15px; font-size: 1.4rem; border-left: 4px solid #4a3b6e; padding-left: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #c9c0d4; padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background-color: #e4e0d4; font-weight: 600; color: #4a3b6e; }
    .col-num { width: 50px; text-align: center; }
    .col-ref { width: 160px; font-family: monospace; }
    .col-pag { width: 60px; text-align: center; }
    /* ── MAPA DOS LOCAIS ── */
    .mapa-container {
      background: #2d2d44;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,215,0,0.15);
      margin-bottom: 20px;
    }
    .mapa-container .mapa-titulo {
      padding: 15px 20px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .mapa-container .mapa-titulo h3 { color: #ffd700; font-size: 18px; }
    .mapa-container .mapa-titulo .info-locais { color: #aaa; font-size: 14px; }
    .mapa-container .mapa-titulo .info-locais span { color: #ffd700; font-weight: 700; }
    .mapa-container .mapa-titulo .btn-toggle-indice {
      background: #4a3b6e; color: white; border: none; padding: 4px 14px;
      border-radius: 4px; font-size: 12px; cursor: pointer; transition: background 0.2s;
    }
    .mapa-container .mapa-titulo .btn-toggle-indice:hover { background: #362b52; }

    #mapaInterativo { height: 400px; border-radius: 8px; margin-bottom: 20px; background: #1a1a2e; }

    .btn-abrir-mapa-completo {
      display: inline-block; padding: 12px 28px; background: #ffd700; color: #1a1a2e;
      border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px;
      transition: transform 0.2s; border: none; cursor: pointer; margin: 4px 0;
    }
    .btn-abrir-mapa-completo:hover { transform: scale(1.03); }

    .mapa-botoes {
      display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 20px;
      background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* ── LISTA DE LOCAIS DO CAPÍTULO ── */
    #lista-locais-licao {
      background: #f5f3f0; border-radius: 8px; border: 1px solid #c9c0d4;
      margin-top: 15px; padding: 12px 16px; display: none;
    }
    #lista-locais-licao .header-indice { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #lista-locais-licao .header-indice h4 { color: #4a3b6e; font-size: 14px; margin: 0; }
    #lista-locais-licao .header-indice .count {
      background: #4a3b6e; color: white; padding: 0 10px; border-radius: 10px;
      font-size: 11px; line-height: 20px; display: inline-block;
    }
    #lista-locais-licao .btn-fechar-indice { background: none; border: none; font-size: 18px; cursor: pointer; color: #888; }
    #lista-locais-licao .btn-fechar-indice:hover { color: #333; }
    #itens-indice-locais { display: flex; flex-wrap: wrap; gap: 6px; }
    .item-indice-local {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 12px;
      border: 1px solid rgba(0,0,0,0.05);
    }
    .item-indice-local:hover { transform: scale(1.03); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .item-indice-local .emoji-indice { font-size: 14px; }
    .item-indice-local .nome-indice { font-weight: 600; color: #2d2d2d; }
    .item-indice-local .tipo-indice { font-size: 10px; color: #888; background: #e4e0d4; padding: 0 6px; border-radius: 4px; }
    .item-indice-local .ref-indice { font-size: 10px; color: #4a3b6e; font-family: monospace; background: #ede9f5; padding: 0 6px; border-radius: 4px; }

    /* ── LOCAIS NO CONTEXTO ── */
    .locais-contexto-box {
      margin-top: 8px; padding: 8px 12px; background: rgba(255, 215, 0, 0.08);
      border-radius: 6px; border-left: 3px solid #ffd700;
    }
    .locais-contexto-box .label { font-size: 11px; font-weight: 600; color: #5c4a1e; margin-bottom: 4px; }
    .locais-contexto-tag {
      display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px;
      margin: 2px 4px 2px 0; color: white; font-weight: 500; cursor: pointer;
      transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.2);
    }
    .locais-contexto-tag:hover { transform: scale(1.05); }
    .btn-ver-mapa-contexto {
      display: inline-block; margin-top: 6px; padding: 4px 12px; background: #4a3b6e;
      color: white; border: none; border-radius: 4px; font-size: 11px; cursor: pointer;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-ver-mapa-contexto:hover { background: #362b52; }

    /* ── POPUP E CLUSTER DO MAPA ── */
    .custom-popup .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .custom-popup .leaflet-popup-content { font-size: 13px; line-height: 1.5; min-width: 200px; }
    .marker-cluster-small { background-color: rgba(255, 215, 0, 0.6); }
    .marker-cluster-small div { background-color: rgba(255, 215, 0, 0.8); color: #1a1a2e; }
    .marker-cluster-medium { background-color: rgba(255, 165, 0, 0.6); }
    .marker-cluster-medium div { background-color: rgba(255, 165, 0, 0.8); color: #1a1a2e; }
    .marker-cluster-large { background-color: rgba(220, 20, 60, 0.6); }
    .marker-cluster-large div { background-color: rgba(220, 20, 60, 0.8); color: white; }

    /* ── FILMES BÍBLICOS ── */
    .filmes-card {
        margin-top: 10px; padding: 8px 12px; background: rgba(74, 59, 110, 0.06);
        border-radius: 6px; border-left: 3px solid #4a3b6e;
    }
    .filmes-card .label { font-size: 11px; font-weight: 600; color: #362b52; margin-bottom: 4px; }
    .filme-item {
        margin-bottom: 6px; padding: 6px 10px; background: white; border-radius: 4px;
        border: 1px solid #e8e8e8; transition: box-shadow 0.2s;
    }
    .filme-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .filme-item .titulo { font-size: 13px; font-weight: 600; color: #2d2d2d; }
    .filme-item .ano { font-size: 11px; color: #888; }
    .filme-item .diretor { font-size: 11px; color: #888; }
    .filme-item .descricao { font-size: 12px; color: #555; margin-top: 2px; }
    .filme-item .observacao { font-size: 11px; color: #888; font-style: italic; }
    .filme-item .links { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
    .filme-link {
        display: inline-block; background: #4a3b6e; color: white; font-size: 11px;
        padding: 3px 10px; border-radius: 10px; text-decoration: none; transition: background 0.2s;
    }
    .filme-link:hover { background: #362b52; }

    /* ============================================
       BLOCOS COLAPSÁVEIS (Imagem / Filmes relacionados)
       ============================================ */
    details.bloco-colapsavel,
    details.filmes-card {
        cursor: default;
    }
    details.bloco-colapsavel > summary,
    details.filmes-card > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;
    }
    details.bloco-colapsavel > summary::-webkit-details-marker,
    details.filmes-card > summary::-webkit-details-marker {
        display: none;
    }
    details.bloco-colapsavel > summary::before,
    details.filmes-card > summary::before {
        content: '▸';
        display: inline-block;
        font-size: 10px;
        transition: transform 0.15s ease;
    }
    details.bloco-colapsavel[open] > summary::before,
    details.filmes-card[open] > summary::before {
        transform: rotate(90deg);
    }
    .badge-contagem {
        display: inline-block;
        background: #4a3b6e;
        color: white;
        font-size: 10px;
        font-weight: 700;
        padding: 1px 7px;
        border-radius: 10px;
    }
    .conteudo-colapsavel {
        margin-top: 8px;
    }

    .netlify-section { background: #f5f3f0; padding: 15px; border-radius: 8px; border: 1px solid #c9c0d4; }
    .netlify-section input { width: 70%; padding: 8px 12px; border: 1px solid #c9c0d4; border-radius: 4px; margin-right: 10px; }
    .netlify-section button { background-color: #4a3b6e; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    #api-config.oculto { display: none; }
    .contexto-card { background-color: #f5f3f0; border-left: 5px solid #4a3b6e; padding: 15px; margin-bottom: 20px; border-radius: 0 8px 8px 0; }
    .contexto-titulo { font-weight: bold; font-size: 13px; margin-bottom: 10px; color: #4a3b6e; background-color: #e4e0d4; padding: 8px; border-radius: 6px; }
    .contexto-versiculo { font-style: italic; background: white; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #c9c0d4; }
    .contexto-versiculo.loading { color: #999; }
    .contexto-campo { margin-bottom: 10px; font-size: 13px; }
    .contexto-campo strong { color: #4a3b6e; }
    .contexto-tags-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; background-color: #e4e0d4; padding: 6px 8px; border-radius: 4px; }
    .contexto-tags-label { font-size: 11px; color: #666; }
    .assuntos { display: flex; flex-wrap: wrap; gap: 6px; }
    .assunto-tag { background-color: #4a3b6e; color: white; padding: 2px 8px; border-radius: 15px; font-size: 10px; white-space: nowrap; }
    .link-volta { text-align: right; margin-top: 10px; font-size: 18px; display: flex; gap: 15px; justify-content: flex-end; }
    .link-volta a { color: #4a3b6e; text-decoration: none; }
    .footer-links { margin-top: 15px; text-align: right; font-size: 12px; }
    .footer-links a { color: #4a3b6e; text-decoration: none; margin-left: 15px; }
    .loading { text-align: center; padding: 40px; color: #666; }
    /* ── HIERARQUIA ── */
    .hierarquia-lista { list-style: none; padding-left: 0; }
    .hierarquia-lista li { margin-bottom: 4px; }
    .hierarquia-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 8px; border-radius: 6px; }
    .hierarquia-item:hover { background: #ede9f5; }
    .hierarquia-label { font-size: 13px; font-weight: 600; color: #4a3b6e; }
    .hierarquia-refs { margin-top: 4px; padding-left: 16px; }
    .hierarquia-ref-item { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 12px; }
    .hierarquia-ref-link { color: #4a3b6e; font-weight: bold; text-decoration: none; font-family: monospace; }
    .hierarquia-ref-link:hover { text-decoration: underline; }
    .hierarquia-tags { color: #888; font-size: 11px; font-style: italic; }
    .hierarquia-filhos { padding-left: 20px; margin-top: 4px; border-left: 2px solid #c9c0d4; }
    .nivel-1 > .hierarquia-item > .hierarquia-label { font-size: 14px; color: #362b52; }
    /* ── MERMAID ── */
    .mermaid-wrapper { background: #f5f3f0; border: 1px solid #c9c0d4; border-radius: 8px; padding: 20px; overflow-x: auto; }
    .sem-mermaid, .sem-perguntas { color: #999; font-style: italic; font-size: 13px; padding: 20px; text-align: center; }
    /* ── PERGUNTAS ── */
    .pergunta-card { background: #f5f3f0; border: 1px solid #c9c0d4; border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
    .pergunta-subtitulo { color: #4a3b6e; font-size: 13px; margin: 18px 0 10px; padding-bottom: 4px; border-bottom: 2px solid #c9c0d4; }
    .pergunta-subtitulo:first-child { margin-top: 0; }
    .icone-gabarito { cursor: pointer; font-size: 14px; margin-left: 4px; user-select: none; }
    .icone-gabarito:hover { transform: scale(1.15); display: inline-block; }
    .gabarito-box { display: none; margin-top: 10px; padding: 10px 12px; background: #f3eefc; border: 1px dashed #b3a3d4; border-radius: 6px; font-size: 12px; }
    .gabarito-box.aberto { display: block; animation: fadeIn 0.25s ease; }
    .gabarito-linha { margin-bottom: 5px; }
    .gabarito-linha strong { color: #4a3b6e; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .pergunta-texto { font-weight: 600; font-size: 13px; color: #362b52; margin-bottom: 8px; }
    .pergunta-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #666; }
    .pergunta-pagina { background: #4a3b6e; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .pergunta-tags { font-style: italic; color: #888; }
    .pergunta-refs { display: flex; gap: 6px; flex-wrap: wrap; }
    .pergunta-ref-badge { background: #e4e0d4; color: #4a3b6e; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-family: monospace; cursor: pointer; }
    .pergunta-ref-badge:hover { background: #c9c0d4; }
    /* ── API CONFIG ── */
    .api-config { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; }
    .api-config label { font-size: 13px; font-weight: 600; color: #4a3b6e; }
    .api-config select, .api-config input { padding: 6px 10px; border: 1px solid #c9c0d4; border-radius: 4px; font-size: 13px; }
    .api-config input { width: 300px; }
    .api-config button { background: #4a3b6e; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .api-config .api-linha { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .api-config .api-linha:first-child { margin-top: 0; }
    .api-status-badge { font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 500; }
    .api-status-badge.ativa { background: #c8e6c9; color: #2e7d32; }
    .api-status-badge.inativa { background: #ffcdd2; color: #c62828; }
    .api-status-badge.aguardando { background: #fff3e0; color: #e65100; }
    /* ── MODAL LEGENDA EMOJIS ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.aberto { display: flex; }
    .modal-box { background: white; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .modal-header { background: #4a3b6e; color: white; padding: 16px 20px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
    .modal-header h3 { font-size: 16px; }
    .modal-fechar { background: none; border: none; color: white; font-size: 22px; cursor: pointer; line-height: 1; }
    .modal-body { padding: 16px 20px; }
    .legenda-grid-modal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .legenda-item-modal { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 8px; border-radius: 6px; }
    .legenda-item-modal:hover { background: #ede9f5; }
    .legenda-emoji-modal { font-size: 18px; min-width: 32px; text-align: center; }
    @media (max-width: 600px) { .legenda-grid-modal { grid-template-columns: 1fr; } }
    @media (max-width: 768px) { section { padding: 15px; } .api-config input { width: 100%; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 Teologia Descomplicada <span style="font-size:0.7em;opacity:0.8;">v5</span></h1>
    <div style="display:flex;gap:10px;">
      <button id="btnLegendaEmojis" style="color:white;background-color:#4a3b6e;padding:8px 16px;border-radius:6px;border:none;font-size:14px;cursor:pointer;">📋 Legenda de Emojis</button>
      <a href="index.html">🏠 Cursos</a>
    </div>
  </header>

  <div class="seletor-area">
    <div class="seletor-linha">
      <label>Livro:</label>
      <select id="seletorLivro"></select>
      <label>Capítulo:</label>
      <select id="seletorCapitulo"></select>
      <button id="carregarBtn">🔤 Carregar Capítulo</button>
      <button id="btnToggleApiConfig" style="background:#e4e0d4;color:#4a3b6e;border:1px solid #c9c0d4;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;">🔑 Mostrar Configuração das APIs</button>
    </div>
    <div id="tituloDinamico" class="titulo-capitalizado">Selecione um capítulo</div>
    <p style="font-size:11px;color:#888;margin-top:6px;">
      ℹ️ A v4 só lista capítulos que já têm arquivo <code>-v4.js</code> próprio. Capítulos ainda não migrados continuam disponíveis na
      <a href="teologia-v2.html">Teologia Descomplicada v2</a>.
    </p>
  </div>

  <div id="conteudo-principal">
    <div class="loading">📚 Selecione um capítulo e clique em "Carregar Capítulo"</div>
  </div>
</div>

<!-- MODAL LEGENDA DE EMOJIS -->
<div class="modal-overlay" id="modalLegenda">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📋 Legenda de Emojis</h3>
      <button class="modal-fechar" id="fecharModalLegenda">✕</button>
    </div>
    <div class="modal-body">
      <div class="legenda-grid-modal" id="legendaGridModal"></div>
    </div>
  </div>
</div>

<script src="biblioteca/biblia-almeida.js"></script>
<script src="biblioteca/periodos-biblicos.js"></script>
<script src="biblioteca/periodos-seculares.js"></script>
<script src="biblioteca/periodos-humanidade.js"></script>
<script src="biblioteca/classificacao-livros-biblicos.js"></script>
<script src="biblioteca/eventos-biblicos.js"></script>
<script src="biblioteca/titulos-biblicos.js"></script>
<script src="biblioteca/motor-contextos.js"></script>
<script src="biblioteca/legendas-emogis.js"></script>
<script src="biblioteca/perguntas-teologia.js"></script>
<script src="biblioteca/mermaid-teologia.js"></script>

<script>
// ============================================
// CONFIG DAS 3 APIS (separadas)
// ============================================

function parseReferencia(referencia) {
  // Aceita tanto "Jz 3.15" (padrão dominical, com ponto) quanto
  // "Jz 6:12" (padrão teologia, extraído direto do livro, com dois-pontos)
  const m = referencia.match(/^(\d?\s?[^\d.:]+?)\s*(\d+)[.:](\d+(?:[-,]\d+)*)/);
  if (!m) return null;
  const livroTxt = m[1].trim().toLowerCase().replace(/\s+/g, ' ');
  const capitulo = parseInt(m[2], 10);
  const slug = LIVRO_SLUG[livroTxt] || LIVRO_SLUG[livroTxt.replace(/\s/g, '')];
  if (!slug) return null;
  const versParte = m[3];
  let versiculos = [];
  // Trata cada pedaço separado por vírgula individualmente, expandindo
  // ranges com hífen dentro de cada pedaço (ex: "2,18-20" -> [2,18,19,20])
  versParte.split(',').forEach(pedaco => {
    if (pedaco.includes('-')) {
      const [ini, fim] = pedaco.split('-').map(Number);
      if (!isNaN(ini) && !isNaN(fim)) {
        for (let v = ini; v <= fim; v++) versiculos.push(v);
      }
    } else {
      const v = Number(pedaco);
      if (!isNaN(v)) versiculos.push(v);
    }
  });
  return { slug, capitulo, versiculos };
}

function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Fila com concorrência limitada ──
function criarFila(concorrenciaMax) {
  let ativos = 0;
  const pendentes = [];
  const proximo = () => {
    if (ativos >= concorrenciaMax || pendentes.length === 0) return;
    ativos++;
    const { tarefa, resolve, reject } = pendentes.shift();
    tarefa().then(resolve, reject).finally(() => { ativos--; proximo(); });
  };
  return (tarefa) => new Promise((resolve, reject) => {
    pendentes.push({ tarefa, resolve, reject });
    proximo();
  });
}
const filaVersiculos = criarFila(1);

// ── Bíblia (bible-api.com) — fonte PRIMÁRIA, gratuita, sem chave necessária ──
// Rate limit do serviço: 15 requisições a cada 30s por IP. Por isso ela também
// respeita o mesmo "delay entre tentativas" configurado na tela.
async function buscarVersiculoBibliaAPI(referencia, tentativa = 0) {
  const ref = parseReferencia(referencia);
  if (!ref) return null;
  const nomeLivro = NOME_LIVRO_PT[ref.slug];
  if (!nomeLivro) return null;
  if (!ref.versiculos || ref.versiculos.length === 0) return null;

  const versParte = ref.versiculos.join(',');
  const query = encodeURIComponent(`${nomeLivro} ${ref.capitulo}:${versParte}`);

  try {
    const res = await fetch(`https://bible-api.com/${query}?translation=almeida`);
    if (res.status === 429) {
      if (tentativa < 2) {
        await esperar(1500 * (tentativa + 1));
        return buscarVersiculoBibliaAPI(referencia, tentativa + 1);
      }
      return { rateLimited: true };
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Quando a referência cobre 2+ versículos, a bible-api.com devolve um
    // array "verses" com cada versículo separado — usamos isso para numerar.
    if (Array.isArray(data.verses) && data.verses.length > 1) {
      const numerado = data.verses
        .map(v => `<strong>${v.verse}</strong> ${(v.text || '').trim().replace(/\s+/g, ' ')}`)
        .join(' ');
      return numerado || null;
    }

    const texto = (data.text || '').trim().replace(/\s+/g, ' ');
    return texto || null;
  } catch (e) {
    // "Failed to fetch" costuma ser o rate limit (429) do bible-api.com
    // aparecendo como erro de CORS no navegador (a resposta de erro do
    // serviço não inclui cabeçalho CORS). Vale tentar de novo antes de desistir.
    if (tentativa < 2) {
      await esperar(1500 * (tentativa + 1));
      return buscarVersiculoBibliaAPI(referencia, tentativa + 1);
    }
    console.warn('Erro Bíblia (bible-api.com):', e.message);
    return null;
  }
}

// ── Groq ──
async function buscarVersiculoGroq(referencia, tentativa = 0) {
  if (!apiKeys.groq) return null;
  const prompt = `Forneça APENAS o texto do(s) versículo(s) bíblico(s) "${referencia}" na versão Almeida Revista e Corrigida (ARC) em português. Se a referência cobrir mais de um versículo, numere cada um antes do seu respectivo texto (formato: "19 texto do versículo 20 texto do versículo"). Não inclua nenhuma explicação, comentário ou formatação adicional.`;
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKeys.groq}` },
      body: JSON.stringify({ 
        model: 'openai/gpt-oss-20b', 
        messages: [{ role: 'user', content: prompt }], 
        max_tokens: 300, 
        temperature: 0 
      })
    });
    if (res.status === 429) {
      if (tentativa < 3) { 
        await esperar(2000 * (tentativa + 1)); 
        return buscarVersiculoGroq(referencia, tentativa + 1); 
      }
      return { rateLimited: true };
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || null;
  } catch (e) { 
    console.warn('Erro Groq:', e.message); 
    return null; 
  }
}

// ── Bíblia local (arquivo estático "biblioteca/biblia-almeida.js", domínio público) ──
// Busca instantânea, sem rede, sem rate limit. Sempre a primeira tentativa.
function buscarVersiculoLocal(referencia) {
  if (!window.BIBLIA_ALMEIDA) return null; // arquivo não carregou por algum motivo
  const ref = parseReferencia(referencia);
  if (!ref) return null;
  const capitulos = window.BIBLIA_ALMEIDA[ref.slug];
  if (!capitulos) return null;
  const versiculosCap = capitulos[ref.capitulo - 1];
  if (!versiculosCap || !ref.versiculos || ref.versiculos.length === 0) return null;

  const encontrados = ref.versiculos
    .map(v => ({ numero: v, texto: versiculosCap[v - 1] }))
    .filter(v => v.texto);
  if (encontrados.length === 0) return null;

  // Referência de um único versículo: mantém o texto simples, sem numeração.
  if (encontrados.length === 1) return encontrados[0].texto;

  // Referência com 2+ versículos: numera cada um para facilitar a leitura.
  return encontrados.map(v => `<strong>${v.numero}</strong> ${v.texto}`).join(' ');
}

// ── Busca automática: Bíblia local (primária) → bible-api.com (secundária) ──
// A IA (Groq/Mistral) NÃO entra aqui — só é usada sob demanda, veja buscarVersiculoComIA().
async function buscarVersiculoSemIA(referencia) {
  return filaVersiculos(async () => {
    // 0) Tenta a Bíblia local — instantâneo, sem rede, sem limite de requisições
    const resultadoLocal = buscarVersiculoLocal(referencia);
    if (resultadoLocal) {
      return resultadoLocal;
    }

    // 1) Tenta a Bíblia (bible-api.com) — opção secundária, gratuita, sem chave
    if (apiStatus.biblia !== 'inativa') {
      const resultadoBiblia = await buscarVersiculoBibliaAPI(referencia);
      if (resultadoBiblia && typeof resultadoBiblia === 'string') {
        return resultadoBiblia;
      }
    }

    return null;
  });
}

// ── Busca manual de emergência: rodízio Groq ↔ Mistral (IA) ──
// Só é chamada quando o usuário clica no botão "🆘 Tentar com IA" de um versículo que falhou.
async function buscarVersiculoComIA(referencia) {
  return filaVersiculos(async () => {
    const provedores = ['groq', 'mistral'];
    let tentativas = 0;
    const maxTentativas = 4; // 2 provedores * 2 tentativas cada

    const algumConfigurado = provedores.some(p => !!apiKeys[p]);
    if (!algumConfigurado) {
      return null;
    }

    while (tentativas < maxTentativas) {
      // Pega o próximo provedor da lista (round-robin)
      const provider = provedores[config.currentIndex % provedores.length];
      config.currentIndex++;

      if (!apiKeys[provider]) {
        tentativas++;
        if (tentativas < maxTentativas) await esperar(200);
        continue;
      }

      let resultado;
      if (provider === 'groq') {
        resultado = await buscarVersiculoGroq(referencia);
      } else if (provider === 'mistral') {
        resultado = await buscarVersiculoMistral(referencia);
      }

      if (resultado && !resultado.rateLimited && typeof resultado === 'string') {
        return resultado;
      }

      if (resultado?.rateLimited) {
        await esperar(1500);
      }

      tentativas++;

      if (tentativas < maxTentativas) {
        await esperar(config.delay);
      }
    }

    return null;
  });
}

function alternarBiblia() {
  const ativarAgora = apiStatus.biblia !== 'ativa';
  apiStatus.biblia = ativarAgora ? 'ativa' : 'inativa';
  localStorage.setItem('bibliaAtiva', ativarAgora ? 'true' : 'false');

  const badge = document.querySelector(`[data-api="biblia"]`);
  if (badge) {
    badge.textContent = ativarAgora ? '✅ Ativa' : '⛔ Inativa';
    badge.className = `api-status-badge ${ativarAgora ? 'ativa' : 'inativa'}`;
  }
  const botao = badge?.parentElement?.querySelector('button');
  if (botao) botao.textContent = ativarAgora ? '‖ Desativar' : '▶️ Ativar';

  if (ativarAgora && window._refsUnicasAtual && window._refsUnicasAtual.length > 0) {
    buscarTodosVersiculos(window._refsUnicasAtual, true);
  }
}

function salvarChave(api) {
  const input = document.getElementById(`key${api.charAt(0).toUpperCase() + api.slice(1)}`);
  if (!input) return;
  const key = input.value.trim();
  apiKeys[api] = key;
  localStorage.setItem(`apiKey_${api}`, key);
  
  if (key) {
    apiStatus[api] = 'ativa';
    const badge = document.querySelector(`[data-api="${api}"]`);
    if (badge) {
      badge.textContent = '✅ Ativa';
      badge.className = 'api-status-badge ativa';
    }
    alert(`✅ Chave da ${api.charAt(0).toUpperCase() + api.slice(1)} salva! Use o botão "🆘 Tentar com IA" nos versículos que falharem, quando precisar.`);
  } else {
    apiStatus[api] = 'inativa';
    const badge = document.querySelector(`[data-api="${api}"]`);
    if (badge) {
      badge.textContent = '⛔ Inativa';
      badge.className = 'api-status-badge inativa';
    }
    alert(`⚠️ Chave da ${api.charAt(0).toUpperCase() + api.slice(1)} removida.`);
  }
}

function salvarDelay() {
  const input = document.getElementById('delayInput');
  if (!input) return;
  const val = parseInt(input.value, 10);
  if (val >= 500 && val <= 10000) {
    config.delay = val;
    localStorage.setItem('apiDelay', val);
    document.getElementById('delayDisplay').textContent = val;
    alert(`✅ Delay salvo: ${val}ms`);
  } else {
    alert('⚠️ O delay deve estar entre 500ms e 10000ms');
  }
}

// ── CONTEXTOS (v4 — motor automático, igual dominical v4) ──
function obterContexto(id, dadosLicao, referencia) {
  const fino = dadosLicao?.contextosReferencias?.[id];
  if (fino && typeof window.montarContextoCompleto === 'function') {
    return window.montarContextoCompleto(fino);
  }
  if (referencia && typeof window.inferirContextoAutomatico === 'function') {
    return window.inferirContextoAutomatico(id, referencia);
  }
  return null;
}

function formatarCabecalhoContexto(ctx) {
  let h = `📖 ${ctx.referencia}`;
  if (ctx.autoInferido)         h += ` 🔮`;
  if (ctx.data)                h += ` | 📅 ${ctx.data}`;
  if (ctx.local)                h += ` | 🚩 ${ctx.local}`;
  if (ctx.lider)                h += ` | 👑 ${ctx.lider}`;
  if (ctx.era)                  h += ` | 📜 ${ctx.era}${ctx.eraDatas ? ' (' + ctx.eraDatas + ')' : ''}`;
  if (ctx.classificacao)        h += ` | 📚 ${ctx.classificacao}`;
  if (ctx.periodoSecular)       h += ` | ⏳ ${ctx.periodoSecular}${ctx.periodoSecularDatas ? ' (' + ctx.periodoSecularDatas + ')' : ''}`;
  if (ctx.periodoHumanidade)    h += ` | 🏰 ${ctx.periodoHumanidade}${ctx.periodoHumanidadeDatas ? ' (' + ctx.periodoHumanidadeDatas + ')' : ''}`;
  return h;
}

// ── HIERARQUIA ──
function renderizarHierarquia(nos, nivel) {
  if (!nos || nos.length === 0) return '';
  let html = `<ul class="hierarquia-lista">`;
  nos.forEach(no => {
    html += `<li class="nivel-${nivel}"><div class="hierarquia-item"><div>
      <div class="hierarquia-label">${no.label}</div>`;
    if (no.refs?.length) {
      html += `<div class="hierarquia-refs">`;
      no.refs.forEach(r => {
        html += `<div class="hierarquia-ref-item">
          <a class="hierarquia-ref-link" href="#${r.id}-contexto">${r.referencia}</a>
          <span class="hierarquia-tags">${r.tags || ''}</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div></div>`;
    if (no.filhos?.length) html += `<div class="hierarquia-filhos">${renderizarHierarquia(no.filhos, nivel + 1)}</div>`;
    html += `</li>`;
  });
  return html + `</ul>`;
}

function embaralhar(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let mapaAtual = null;

// ============================================
// FUNÇÃO: EXTRAIR LOCAIS DO CAPÍTULO
// ============================================
function extrairLocaisDaLicao(dadosLicao) {
    if (!dadosLicao) return [];
    if (typeof window.locaisBiblicos === 'undefined') {
        console.warn('locaisBiblicos não carregado');
        return [];
    }

    // 1. Pegar todas as referências do capítulo
    const refsLicao = [];

    // Da lista de aparição
    if (dadosLicao.listaAparicao) {
        dadosLicao.listaAparicao.forEach(item => {
            if (item.referencia) refsLicao.push(item.referencia);
        });
    }

    // Da hierarquia (refs aninhadas)
    if (dadosLicao.hierarquia) {
        function extrairRefs(nos) {
            nos.forEach(no => {
                if (no.refs) {
                    no.refs.forEach(r => {
                        if (r.referencia) refsLicao.push(r.referencia);
                    });
                }
                if (no.filhos) extrairRefs(no.filhos);
            });
        }
        extrairRefs(dadosLicao.hierarquia);
    }

    // Remover duplicatas
    const refsUnicas = [...new Set(refsLicao)];
    console.log(`📖 ${refsUnicas.length} referências únicas encontradas no capítulo`);

    // 2. Buscar locais correspondentes
    const locaisEncontrados = [];
    const locaisData = window.locaisBiblicos;

    refsUnicas.forEach(ref => {
        const refNorm = ref.trim();

        Object.values(locaisData).forEach(local => {
            if (!local.referencias || !Array.isArray(local.referencias)) return;

            const match = local.referencias.some(r => {
                const rNorm = r.trim();
                return rNorm === refNorm ||
                       rNorm.includes(refNorm) ||
                       refNorm.includes(rNorm);
            });

            if (match) {
                const id = local.id || local.nomeOriginal || local.nome;
                if (!locaisEncontrados.some(l => (l.id || l.nomeOriginal || l.nome) === id)) {
                    locaisEncontrados.push({
                        ...local,
                        referenciaMatch: ref
                    });
                }
            }
        });
    });

    console.log(`📍 ${locaisEncontrados.length} locais encontrados para o capítulo`);
    return locaisEncontrados;
}

// ============================================
// FUNÇÃO: ADICIONAR MARCADORES NO MAPA
// ============================================
function adicionarMarcadoresNoMapa(map, locais) {
    if (!map || !locais || locais.length === 0) return;

    const markers = L.markerClusterGroup({
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        iconCreateFunction: function(cluster) {
            const count = cluster.getChildCount();
            const size = count < 10 ? 'small' : count < 50 ? 'medium' : 'large';
            return L.divIcon({
                html: `<div><span>${count}</span></div>`,
                className: `marker-cluster marker-cluster-${size}`,
                iconSize: [40, 40]
            });
        }
    });

    locais.forEach(local => {
        const lat = parseFloat(local.latitude);
        const lng = parseFloat(local.longitude);

        if (isNaN(lat) || isNaN(lng)) return;
        if (lat === 0 && lng === 0) return;
        if (lat === 0 && lng === 14) return;

        const tipo = local.tipo || 'local';
        const cor = window.getCorLocal ? window.getCorLocal(tipo) : '#FFD700';
        const corTexto = window.getCorTextoLocal ? window.getCorTextoLocal(tipo) : '#FFFFFF';
        const emoji = window.getEmojiLocal ? window.getEmojiLocal(tipo) : '📍';

        const icon = L.divIcon({
            className: 'custom-icon',
            html: `<div style="
                width: 14px;
                height: 14px;
                background: ${cor};
                border-radius: 50%;
                border: 3px solid white;
                box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            "></div>`,
            iconSize: [14, 14],
            iconAnchor: [7, 7],
            popupAnchor: [0, -7]
        });

        const nome = local.nome || local.nomeOriginal || local.id || 'Local';
        const refs = local.referencias ? local.referencias.join(' ') : '';
        const refMatch = local.referenciaMatch || '';
        const id = local.id || local.nomeOriginal || local.nome;

        let popupContent = `
            <div style="font-weight:700;font-size:15px;color:#1a1a2e;">
                ${emoji} ${nome}
            </div>
            <div style="color:#555;font-size:12px;margin:4px 0;">
                ${local.nomeOriginal || ''} ${local.nomeAntigo ? '| ' + local.nomeAntigo : ''}
            </div>
        `;

        if (local.descricao) {
            popupContent += `
                <div style="font-size:12px;color:#555;max-height:80px;overflow-y:auto;margin:4px 0;">
                    ${local.descricao.substring(0, 120)}${local.descricao.length > 120 ? '...' : ''}
                </div>
            `;
        }

        popupContent += `
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">
                <span style="background:${cor};color:${corTexto};padding:1px 10px;border-radius:12px;font-size:11px;font-weight:600;">
                    ${tipo}
                </span>
                ${refs ? `<span style="background:#f0f0f0;padding:1px 8px;border-radius:4px;font-size:11px;font-family:monospace;">📖 ${refs}</span>` : ''}
                ${refMatch ? `<span style="background:#FFD700;padding:1px 8px;border-radius:4px;font-size:10px;font-weight:600;color:#1a1a2e;">🎯 Destaque do Capítulo</span>` : ''}
            </div>
        `;

        const marker = L.marker([lat, lng], { icon });
        marker.bindPopup(popupContent, {
            maxWidth: 320,
            maxHeight: 300,
            className: 'custom-popup'
        });
        marker._id = id;
        marker._localData = local;

        markers.addLayer(marker);
        marcadoresMapa[id] = marker;
    });

    map.addLayer(markers);
}

// ============================================
// FUNÇÃO: CRIAR MAPA COM LOCAIS DO CAPÍTULO
// ============================================
function criarMapaComLocaisDaLicao(dadosLicao) {
    const el = document.getElementById('mapaInterativo');
    if (!el) {
        console.warn('Elemento #mapaInterativo não encontrado');
        return null;
    }

    if (typeof L === 'undefined') {
        console.warn('Leaflet não carregado');
        return null;
    }

    if (mapaAtual) {
        mapaAtual.remove();
        mapaAtual = null;
    }

    const centro = dadosLicao?.mapaConfig?.centro || [32.6, 35.3];
    const zoom = dadosLicao?.mapaConfig?.zoom || 8;

    const map = L.map(el).setView(centro, zoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    mapaAtual = map;

    const locaisDaLicao = extrairLocaisDaLicao(dadosLicao);
    locaisDaLicaoAtual = locaisDaLicao;

    if (locaisDaLicao.length > 0) {
        adicionarMarcadoresNoMapa(map, locaisDaLicao);

        try {
            const group = L.featureGroup();
            locaisDaLicao.forEach(local => {
                const lat = parseFloat(local.latitude);
                const lng = parseFloat(local.longitude);
                if (!isNaN(lat) && !isNaN(lng)) {
                    group.addLayer(L.marker([lat, lng]));
                }
            });
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        } catch(e) {
            console.warn('Não foi possível ajustar o zoom:', e);
        }
    }

    const contador = document.getElementById('contador-locais');
    if (contador) {
        contador.textContent = locaisDaLicao.length;
    }

    // Renderizar índice de locais
    renderizarIndiceLocais(locaisDaLicao);

    console.log(`✅ Mapa carregado com ${locaisDaLicao.length} locais do capítulo`);
    return map;
}

        const emoji = window.getEmojiLocal ? window.getEmojiLocal(local.tipo || 'local') : '📍';
        const nome = local.nome || local.nomeOriginal || local.id || 'Local';
        const refs = local.referencias ? local.referencias.join(' ') : '';
        const id = local.id || local.nomeOriginal || local.nome;

// ============================================
// IR PARA LOCAL NO MAPA (PELA LISTA)
// ============================================
function irParaLocalNoMapa(id) {
    const local = locaisDaLicaoAtual.find(l => (l.id || l.nomeOriginal || l.nome) === id);
    if (!local) return;

    if (mapaAtual) {
        const lat = parseFloat(local.latitude);
        const lng = parseFloat(local.longitude);
        if (!isNaN(lat) && !isNaN(lng)) {
            mapaAtual.setView([lat, lng], 12, { animate: true, duration: 0.6 });

            setTimeout(() => {
                const marker = marcadoresMapa[id];
                if (marker) {
                    marker.openPopup();
                }
            }, 400);
        }
    }
}

function salvarLocaisDaLicao(dadosLicao) {
    if (!dadosLicao) return;

    try {
        const locais = extrairLocaisDaLicao(dadosLicao);

        const dadosParaSalvar = {
            titulo: dadosLicao.titulo || 'Capítulo',
            trimestre: dadosLicao.trimestre || '',
            locais: locais.map(local => ({
                id: local.id || local.nomeOriginal || local.nome,
                nome: local.nome || local.nomeOriginal,
                tipo: local.tipo,
                latitude: local.latitude,
                longitude: local.longitude,
                referencias: local.referencias
            }))
        };

        localStorage.setItem('licaoAtual', JSON.stringify(dadosParaSalvar));
        console.log(`💾 ${locais.length} locais do capítulo salvos no localStorage`);
    } catch (e) {
        console.warn('Erro ao salvar locais do capítulo:', e);
    }
}

    html += `</tbody></table><div class="footer-links"><a href="#hierarquia">📋 Hierarquia de tópicos ↑</a></div></section>`;
  }

  html += `
  <section id="mapas">
    <h2>🌏⛺ Mapa dos Locais Bíblicos</h2>

    <div class="mapa-container">
      <div class="mapa-titulo">
        <h3>🗺️ Mapa Interativo</h3>
        <div class="info-locais">
          🏛️ <span id="contador-locais">0</span> locais carregados
          <span style="margin-left:12px;color:#666;">|</span>
          <span style="color:#888;font-size:13px;">Clique nos marcadores para ver detalhes</span>
        </div>
        <button class="btn-toggle-indice" onclick="toggleListaLocais()">📋 Mostrar Locais</button>
      </div>

      <div id="mapaInterativo"></div>

      <!-- LISTA DE LOCAIS DO CAPÍTULO -->
      <div id="lista-locais-licao">
        <div class="header-indice">
          <h4>📍 Locais do Capítulo <span class="count" id="contador-indice">0</span></h4>
          <button class="btn-fechar-indice" onclick="fecharListaLocais()">✕</button>
        </div>
        <div id="itens-indice-locais">
          <span style="color:#888;font-size:13px;font-style:italic;">Nenhum local encontrado</span>
        </div>
      </div>

      <div class="mapa-botoes">
        <a href="biblioteca/mapa-com-indice.html" target="_blank" class="btn-abrir-mapa-completo">
          🗺️ Abrir Mapa Completo com Índice
        </a>
        <span style="font-size:12px;color:#888;align-self:center;">
          🔍 Busque, filtre, veja em PT/EN e clique para ir ao local
        </span>
      </div>
    </div>

    <div class="netlify-section">
      <h3>🔗 Link do Projeto (Netlify)</h3>
      <input type="text" id="netlifyInput" placeholder="Cole o link do projeto">
      <button id="salvarLink">Salvar Link</button>
      <div id="linkSalvo"></div>
    </div>
  </section>

  <section id="contextos"><h2>💬 Contextos das Passagens</h2>
    <p style="font-size:12px;color:#666;margin-bottom:15px;">
      📚 Os versículos vêm primeiro da <strong>Bíblia local</strong> (domínio público, instantânea), depois da <strong>bible-api.com</strong>${apiStatus.biblia === 'ativa' ? '' : ' <strong style="color:#c62828;">— desativada agora</strong>'} online.
      <br>🆘 Se ambas falharem, aparece um botão pra tentar com <strong>IA (Groq/Mistral)</strong> só quando você quiser.
      <br>Contexto histórico vem da biblioteca local.
    </p>
    <div id="containerContextos"></div>
  </section>`;

  container.innerHTML = html;

  // A seção de API sempre nasce oculta a cada capítulo carregado — reseta o texto do botão
  const btnToggleApi = document.getElementById('btnToggleApiConfig');
  if (btnToggleApi) btnToggleApi.textContent = '🔑 Mostrar Configuração das APIs';

  // Mermaid
  if (typeof mermaid !== 'undefined') {
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
    mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
  }

  // Mapa dos locais do capítulo (igual dominical v4)
  setTimeout(() => {
    if (dadosLicaoAtual) {
      criarMapaComLocaisDaLicao(dadosLicaoAtual);
    }
    const netlifyInput = document.getElementById('netlifyInput');
    const salvarBtn    = document.getElementById('salvarLink');
    const linkSalvoDiv = document.getElementById('linkSalvo');
    if (netlifyInput && salvarBtn) {
      const salvo = localStorage.getItem('netlifyLinkTeologia');
      if (salvo) { netlifyInput.value = salvo; linkSalvoDiv.innerHTML = `✅ <a href="${salvo}" target="_blank">${salvo}</a>`; }
      salvarBtn.onclick = () => {
        const link = netlifyInput.value.trim();
        if (link) { localStorage.setItem('netlifyLinkTeologia', link); linkSalvoDiv.innerHTML = `✅ <a href="${link}" target="_blank">${link}</a>`; }
      };
    }
  }, 200);

  // Cards de contexto
  const containerCtx = document.getElementById('containerContextos');
  const listaRef = dados.listaAparicao || [];
  const idsVistos = new Set();
  const refsVistas = new Set();
  const idsParaRenderizar = [];
  const referenciaPorId = new Map(listaRef.filter(i => i.id).map(i => [i.id, i.referencia]));
  listaRef.forEach(item => {
    if (!item.id || idsVistos.has(item.id)) return;
    idsVistos.add(item.id);
    // Mostra só 1 card por referência bíblica única — o conteúdo do contexto
    // (versículo, panorama, locais) é o mesmo independente de quantas vezes
    // a referência aparece no capítulo.
    const refNorm = (item.referencia || '').trim().toLowerCase();
    if (refNorm) {
      if (refsVistas.has(refNorm)) return;
      refsVistas.add(refNorm);
    }
    idsParaRenderizar.push(item.id);
  });

  if (!idsParaRenderizar.length) { containerCtx.innerHTML = '<p>Nenhum contexto disponível.</p>'; return; }

  idsParaRenderizar.forEach(id => {
    const ctx = obterContexto(id, dados, referenciaPorId.get(id) || id);
    const card = document.createElement('div');
    card.className = 'contexto-card';
    card.id = `${id}-contexto`;

    // Buscar locais mencionados nesta referência - PRIORIZA O CAMPO locais DO DADO
    let locaisMencionados = [];

    // 1. Primeiro, tenta pegar do campo 'locais' do próprio item da listaAparicao
    const itemLicao = dados.listaAparicao?.find(item => item.id === id);
    if (itemLicao && itemLicao.locais && itemLicao.locais.length > 0) {
        locaisMencionados = itemLicao.locais.map(local => ({
            nome: local.nome,
            tipo: local.tipo,
            // Tenta encontrar o local correspondente em locaisDaLicaoAtual para ter mais dados
            ...locaisDaLicaoAtual.find(l => (l.nome || l.nomeOriginal) === local.nome)
        }));
    }
    // 2. Fallback: busca nos locais encontrados
    else if (locaisDaLicaoAtual.length > 0) {
        const referenciaDoItem = (referenciaPorId.get(id) || '').trim().toLowerCase();
        locaisMencionados = locaisDaLicaoAtual.filter(local => {
            return referenciaDoItem && local.referencias && local.referencias.some(r => {
                const refNorm = r.trim().toLowerCase();
                return refNorm === referenciaDoItem || refNorm.includes(referenciaDoItem) || referenciaDoItem.includes(refNorm);
            });
        });
    }

    if (ctx) {
      const cabecalho = formatarCabecalhoContexto(ctx);
      const assuntosHtml = (ctx.assuntos || []).map(a => `<span class="assunto-tag">#${a}</span>`).join('');

      const panorama = ctx.panorama || {};
      const pTag = (item) => (item?.personagens?.length ? ` 👤🔗 ${item.personagens.join(', ')}` : '');
      const linhaPanorama = (panorama.antes || panorama.durante || panorama.depois) ? `
        <div class="contexto-campo">🌟
          ${panorama.antes   ? `⏪ ${panorama.antes.titulo} (${panorama.antes.referencia})${pTag(panorama.antes)}`   : ''}
          ${panorama.durante ? `⏺️ ${panorama.durante.titulo} (${panorama.durante.referencia})${pTag(panorama.durante)}` : ''}
          ${panorama.depois  ? `⏩ ${panorama.depois.titulo} (${panorama.depois.referencia})${pTag(panorama.depois)}`      : ''}
        </div>` : '';

      const secao = ctx.secaoEspecifica || {};
      const linhaSecao = (secao.antes || secao.durante || secao.depois) ? `
        <div class="contexto-campo" style="font-size:11px;color:#777;">📑
          ${secao.antes   ? `⏪ ${secao.antes.titulo} (${secao.antes.referencia})`   : ''}
          ${secao.durante ? `⏺️ ${secao.durante.titulo} (${secao.durante.referencia})` : ''}
          ${secao.depois  ? `⏩ ${secao.depois.titulo} (${secao.depois.referencia})` : ''}
        </div>` : '';

      let locaisHtml = '';
      if (locaisMencionados.length > 0) {
        locaisHtml = `
          <div class="locais-contexto-box">
            <div class="label">📍 Locais Mencionados:</div>
            ${locaisMencionados.map(local => {
              const cor = window.getCorLocal ? window.getCorLocal(local.tipo || 'local') : '#808080';
              const nome = local.nome || local.nomeOriginal || local.id || 'Local';
              const idLocal = local.id || local.nomeOriginal || local.nome || nome;
              return `<span class="locais-contexto-tag" style="background:${cor};" onclick="irParaLocalNoMapa('${idLocal}')" title="Clique para ir ao local no mapa">📍 ${nome} (${local.tipo || 'local'})</span>`;
            }).join('')}
            <br>
            <button class="btn-ver-mapa-contexto" onclick="document.getElementById('mapas').scrollIntoView({behavior:'smooth'})">🗺️ Ver todos no Mapa</button>
          </div>
        `;
      }

      const imagemHtml = renderizarImagemDoContexto(id);
      const filmesHtml = renderizarFilmesDoContexto(id);

      card.innerHTML = `
        <div class="contexto-titulo">${cabecalho}</div>
        ${linhaPanorama}
        <div class="contexto-versiculo loading" id="versiculo-${id}">⏳ Buscando versículo (Bíblia local → bible-api.com)...</div>
        ${linhaSecao}
        <div class="contexto-tags-linha">
          ${assuntosHtml ? `<span class="assuntos">${assuntosHtml}</span>` : ''}
        </div>
        ${locaisHtml}
        ${imagemHtml}
        ${filmesHtml}
        <div class="link-volta">
          <a href="#perguntas" title="Perguntas Sugeridas">❓</a><a href="#alfabetica" title="Lista Alfabética">🔤</a><a href="#hierarquia" title="Hierarquia">📋</a>
        </div>`;
    } else {
      const referenciaLimpa = referenciaPorId.get(id) || id;

      let locaisHtml = '';
      if (locaisMencionados.length > 0) {
        locaisHtml = `
          <div class="locais-contexto-box">
            <div class="label">📍 Locais Mencionados:</div>
            ${locaisMencionados.map(local => {
              const cor = window.getCorLocal ? window.getCorLocal(local.tipo || 'local') : '#808080';
              const nome = local.nome || local.nomeOriginal || local.id || 'Local';
              const idLocal = local.id || local.nomeOriginal || local.nome || nome;
              return `<span class="locais-contexto-tag" style="background:${cor};" onclick="irParaLocalNoMapa('${idLocal}')" title="Clique para ir ao local no mapa">📍 ${nome} (${local.tipo || 'local'})</span>`;
            }).join('')}
            <br>
            <button class="btn-ver-mapa-contexto" onclick="document.getElementById('mapas').scrollIntoView({behavior:'smooth'})">🗺️ Ver todos no Mapa</button>
          </div>
        `;
      }

      const imagemHtml = renderizarImagemDoContexto(id);
      const filmesHtml = renderizarFilmesDoContexto(id);

      card.innerHTML = `
        <div class="contexto-titulo">📖 ${referenciaLimpa}</div>
        <div class="contexto-versiculo loading" id="versiculo-${id}">⏳ Buscando versículo (Bíblia local → bible-api.com)...</div>
        ${locaisHtml}
        ${imagemHtml}
        ${filmesHtml}
        <p style="font-size:12px;color:#999;">Contexto não pôde ser inferido automaticamente (livro/capítulo não reconhecido). Pode cadastrar manualmente em contextosReferencias no dados-lvN-cpN-v4.js.</p>
        <div class="link-volta">
          <a href="#perguntas" title="Perguntas Sugeridas">❓</a><a href="#alfabetica" title="Lista Alfabética">🔤</a><a href="#hierarquia" title="Hierarquia">📋</a>
        </div>`;
    }
    containerCtx.appendChild(card);
  });

  const refsUnicas = [...new Map(listaRef.filter(i => i.id && idsParaRenderizar.includes(i.id)).map(r => [r.id, r])).values()];

  // Guarda a lista atual para permitir "Buscar novamente" depois de salvar uma chave
  window._refsUnicasAtual = refsUnicas;

  await buscarTodosVersiculos(refsUnicas);
}

// ============================================
// BUSCA (E RE-BUSCA) DOS VERSÍCULOS — sem IA (Bíblia local + bible-api.com)
// ============================================
async function buscarTodosVersiculos(refsUnicas, somenteFalhas = false) {
  if (!refsUnicas || refsUnicas.length === 0) return;

  const itensParaBuscar = refsUnicas.filter(item => {
    if (!somenteFalhas) return true;
    const el = document.getElementById(`versiculo-${item.id}`);
    return el && !el.classList.contains('ok');
  });

  await Promise.all(itensParaBuscar.map(async (item, index) => {
    const el = document.getElementById(`versiculo-${item.id}`);
    if (!el) return;

    el.classList.add('loading');
    el.classList.remove('ok');
    el.innerHTML = '⏳ Buscando versículo (Bíblia local → bible-api.com)...';

    // Delay entre requisições para não sobrecarregar
    if (index > 0) {
      await esperar(config.delay);
    }

    const texto = await buscarVersiculoSemIA(item.referencia);
    el.classList.remove('loading');
    if (texto) {
      el.classList.add('ok');
      el.innerHTML = `<strong>✝️ ${item.referencia}:</strong><br>"${texto}"`;
    } else {
      el.innerHTML = `<em style="color:#c62828;">Não encontrado na Bíblia local nem na bible-api.com.</em>
        <br><button onclick="tentarComIA('${item.id}')" style="margin-top:6px;font-size:12px;padding:4px 10px;background:#4a3b6e;color:#fff;border:none;border-radius:4px;cursor:pointer;">🆘 Tentar com IA (Groq/Mistral)</button>`;
    }
  }));
}

// Busca manual de emergência para UM versículo específico, acionada pelo botão 🆘
async function tentarComIA(id) {
  const item = (window._refsUnicasAtual || []).find(i => i.id === id);
  const el = document.getElementById(`versiculo-${id}`);
  if (!item || !el) return;

  const algumConfigurado = apiKeys.groq || apiKeys.mistral;
  if (!algumConfigurado) {
    alert('⚠️ Configure a chave da Groq ou da Mistral na seção "Configuração das APIs" antes de usar esse botão.');
    return;
  }

  el.classList.add('loading');
  el.innerHTML = '⏳ Consultando IA (Groq/Mistral)...';

  const texto = await buscarVersiculoComIA(item.referencia);
  el.classList.remove('loading');
  if (texto) {
    el.classList.add('ok');
    el.innerHTML = `<strong>✝️ ${item.referencia} <span style="font-size:11px;color:#999;font-weight:400;">(via IA)</span>:</strong><br>"${texto}"`;
  } else {
    el.innerHTML = `<em style="color:#c62828;">A IA também não conseguiu buscar. Verifique as chaves configuradas.</em>
      <br><button onclick="tentarComIA('${id}')" style="margin-top:6px;font-size:12px;padding:4px 10px;background:#4a3b6e;color:#fff;border:none;border-radius:4px;cursor:pointer;">🆘 Tentar novamente com IA</button>`;
  }
}

function buscarVersiculosNovamente() {
  buscarTodosVersiculos(window._refsUnicasAtual, true);
}

// ============================================
// CAPÍTULOS DISPONÍVEIS NA V4
// Só entram aqui os capítulos que já têm arquivo
// dados-{livro}-{capitulo}-v4.js próprio.
// ============================================
// ============================================
// CAPÍTULOS DISPONÍVEIS NA V4
// O curso completo tem 12 livros, cada um com 7 capítulos.
// O seletor mostra todas as combinações; se o arquivo
// dados-{livro}-{capitulo}-v4.js ainda não existir, aparece
// uma mensagem amigável (tratada em carregarCapitulo/onerror)
// em vez de quebrar a página. Basta criar o arquivo depois
// que já aparece disponível, sem precisar mexer aqui.
// ============================================
const capitulosDisponiveisV4 = {
  "lv6": [1]
};

function popularSeletoresV4() {
  const selLivro = document.getElementById('seletorLivro');
  const selCapitulo = document.getElementById('seletorCapitulo');
  const nomesLivro = {
    "lv1": "Livro 1", "lv2": "Livro 2", "lv3": "Livro 3", "lv4": "Livro 4",
    "lv5": "Livro 5", "lv6": "Livro 6", "lv7": "Livro 7", "lv8": "Livro 8",
    "lv9": "Livro 9", "lv10": "Livro 10", "lv11": "Livro 11", "lv12": "Livro 12"
  };

  selLivro.innerHTML = Object.keys(capitulosDisponiveisV4)
    .map(l => `<option value="${l}">${nomesLivro[l] || l}</option>`).join('');
  selLivro.value = "lv6";

  function popularCapitulos() {
    const caps = capitulosDisponiveisV4[selLivro.value] || [];
    selCapitulo.innerHTML = caps.map(n => `<option value="cp${n}">Capítulo ${n}</option>`).join('');
  }
  selLivro.addEventListener('change', () => { popularCapitulos(); carregarCapitulo(); });
  popularCapitulos();
}
popularSeletoresV4();

// ── CARREGAR ──
function removerScriptAnterior() {
  if (scriptCarregado?.parentNode) { scriptCarregado.parentNode.removeChild(scriptCarregado); scriptCarregado = null; }
  delete window.dadosLicaoV4;
  delete window.dadosLicao;
}

function carregarCapitulo() {
  const livro    = document.getElementById('seletorLivro').value;
  const capitulo = document.getElementById('seletorCapitulo').value;
  if (!capitulo) {
    document.getElementById('conteudo-principal').innerHTML = `<div class="loading">❌ Nenhum capítulo v4 disponível para ${livro}.</div>`;
    return;
  }
  removerScriptAnterior();
  if (mapaAtual) { mapaAtual.remove(); mapaAtual = null; }
  document.getElementById('conteudo-principal').innerHTML = `<div class="loading">📚 Carregando ${livro} ${capitulo} (v5)...</div>`;
  document.getElementById('tituloDinamico').innerHTML = `⏳ Carregando...`;

  const script = document.createElement('script');
  script.src = `dados/teologia/dados-${livro}-${capitulo}-v5.js?v=${Date.now()}`;
  scriptCarregado = script;

  script.onload = () => setTimeout(() => {
    const dados = window.dadosLicaoV4 || window.dadosLicao;
    if (dados) renderizarConteudo(dados);
    else document.getElementById('conteudo-principal').innerHTML = `<div class="loading">❌ Dados não encontrados.</div>`;
  }, 100);

  script.onerror = () => {
    document.getElementById('conteudo-principal').innerHTML = `<div class="loading">❌ Arquivo não encontrado: dados-${livro}-${capitulo}-v5.js</div>`;
  };

  document.body.appendChild(script);
}

document.getElementById('carregarBtn').addEventListener('click', carregarCapitulo);

// Toggle mostrar/ocultar seção de Configuração das APIs (começa oculta)
document.getElementById('btnToggleApiConfig').addEventListener('click', () => {
  const secao = document.getElementById('api-config');
  const btn = document.getElementById('btnToggleApiConfig');
  if (!secao) return;
  const estaOculta = secao.classList.toggle('oculto');
  btn.textContent = estaOculta ? '🔑 Mostrar Configuração das APIs' : '🔑 Ocultar Configuração das APIs';
});
document.addEventListener('DOMContentLoaded', carregarCapitulo);

// ============================================
// MODAL LEGENDA DE EMOJIS
// ============================================
function popularLegendaModal() {
  const grid = document.getElementById('legendaGridModal');
  const lista = window.legendas || (typeof legendas !== 'undefined' ? legendas : null);
  if (!lista) {
    grid.innerHTML = '<p style="color:#999;font-style:italic;grid-column:1/-1;">Arquivo legendas-emogis.js não encontrado.</p>';
    return;
  }
  grid.innerHTML = lista.map(([emoji, descricao]) =>
    `<div class="legenda-item-modal"><span class="legenda-emoji-modal">${emoji}</span><span>${descricao}</span></div>`
  ).join('');
}

document.getElementById('btnLegendaEmojis').addEventListener('click', () => {
  popularLegendaModal();
  document.getElementById('modalLegenda').classList.add('aberto');
});
document.getElementById('fecharModalLegenda').addEventListener('click', () => {
  document.getElementById('modalLegenda').classList.remove('aberto');
});
document.getElementById('modalLegenda').addEventListener('click', (e) => {
  if (e.target.id === 'modalLegenda') document.getElementById('modalLegenda').classList.remove('aberto');
});
</script>
